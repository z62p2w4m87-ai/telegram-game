    function ctx() {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      return audio;
    }
    function beep(freq, dur, type, vol) {
      const a = ctx();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(a.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      o.stop(a.currentTime + dur);
    }
    function sndClick() { beep(520, 0.08, "triangle", 0.04); }
    function sndScene() { beep(330, 0.18, "sine", 0.05); setTimeout(() => beep(440, 0.22, "sine", 0.04), 90); }
    function sndStop() { beep(220, 0.25, "sine", 0.05); }

    function pickVoice() {
      const list = speechSynthesis.getVoices() || [];
      return list.find(v => /ru/i.test(v.lang) && /female|milena|irina|katya|oksana|tanya|anna/i.test(v.name))
          || list.find(v => /ru/i.test(v.lang))
          || list.find(v => /female/i.test(v.name))
          || list[0]
          || null;
    }
    function speak(text) {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ru-RU";
      u.rate = 0.92;
      u.pitch = 1.15;
      u.volume = 1;
      const v = pickVoice();
      if (v) u.voice = v;
      speechSynthesis.speak(u);
    }
    if (window.speechSynthesis) {
      speechSynthesis.onvoiceschanged = pickVoice;
    }

      const s = scenes[id];
      line.textContent = s.text;
      photo.src = IMAGES[s.img];
      photo.classList.toggle("full", ["full1","full2","full3","kneel","bed","top1","top2","top3"].includes(s.img));
      speak(s.text);
      box.innerHTML = "";
      s.choices.forEach((c) => {
        const b = document.createElement("button");
        b.textContent = c.t;
        b.onclick = () => {
          sndClick();
          score += c.pts;
          scoreEl.textContent = score;
          setTimeout(() => { sndScene(); show(c.next); }, 80);
        };
        box.appendChild(b);
      });
      if (id !== "stop" && id !== "end") {
        const stop = document.createElement("button");
        stop.className = "stop";
        stop.textContent = "Стоп";
        stop.onclick = () => { sndStop(); show("stop"); };
        box.appendChild(stop);
      }
    }

    document.body.addEventListener("pointerdown", () => { try { ctx(); } catch(e) {} }, { once: true });
    show("start");
  </script>
</body>
</html>
