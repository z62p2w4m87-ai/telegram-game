      good: { img: "cover", text: "Умница, сказала бы я сама… но лучше слышать это от тебя. Ещё?", choices: [
        { t: "Ещё раунд", next: "start", pts: 0 },
        { t: "Хватит на сегодня", next: "end", pts: 0 }
      ]},
      end: { img: "cover", text: "Раунд кончен. Я не ушла — просто жду, когда снова скажешь «начни».", choices: [
        { t: "Начать заново", next: "start", pts: 0 }
      ]},
      stop: { img: "stand", text: "Сразу остановилась. Воды? Пледа? Или просто помолчим.", choices: [
        { t: "Вернуться в начало", next: "start", pts: 0 }
      ]}
    };

    let score = 0;
    let audio;
    const line = document.getElementById("line");
    const box = document.getElementById("choices");
    const scoreEl = document.getElementById("score");
    const photo = document.getElementById("photo");

    function ctx() {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === "suspended") audio.resume();
      return audio;
    }
    function beep(freq, dur, type, vol) {
      const a = ctx();
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type || "sine";
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(a.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
      o.stop(a.currentTime + dur);
    }
    function sndClick() { beep(520, 0.08, "triangle", 0.04); }
    function sndScene() { beep(330, 0.18, "sine", 0.05); setTimeout(() => beep(440, 0.22, "sine", 0.04), 90); }
    function sndStop() { beep(220, 0.25, "sine", 0.05); }

    function show(id) {
      const s = scenes[id];
      line.textContent = s.text;
      photo.src = IMAGES[s.img];
      box.innerHTML = "";
      s.choices.forEach((c) => {
        const b = document.createElement("button");
        b.textContent = c.t;
        b.onclick = () => {
          sndClick();
          score += c.pts;
          scoreEl.textContent = score;
          setTimeout(() => { sndScene(); show(c.next); }, 80);
        };
        box.appendChild(b);
      });
      if (id !== "stop" && id !== "end") {
        const stop = document.createElement("button");
        stop.className = "stop";
        stop.textContent = "Стоп";
        stop.onclick = () => { sndStop(); show("stop"); };
        box.appendChild(stop);
      }
    }

    document.body.addEventListener("pointerdown", () => { try { ctx(); } catch(e) {} }, { once: true });
    show("start");
  </script>
</body>
</html>
