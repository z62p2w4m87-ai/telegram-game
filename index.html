<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Алина</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #140910; color: #ffeef4; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    .app { min-height: 100%; display: flex; flex-direction: column; padding: 16px; background: radial-gradient(circle at top right, #5a1630 0%, transparent 40%), linear-gradient(#1a0b12, #0d0709); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .name { font-weight: 800; }
    .stat { color: #ffb7c8; font-size: 13px; }
    .card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,180,200,.18); border-radius: 22px; padding: 18px; flex: 1; }
    .who { color: #ff8aa8; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; margin: 0 0 8px; }
    .line { font-size: 20px; line-height: 1.35; margin: 0 0 16px; }
    .choices { display: flex; flex-direction: column; gap: 10px; padding-top: 16px; }
    button { border: 0; background: #ff4d78; color: #2a0710; font-weight: 800; font-size: 16px; padding: 14px 16px; border-radius: 999px; text-align: left; }
    button.stop { background: transparent; color: #c9a3ad; border: 1px solid #5a3340; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="name">Алина, 24</div>
      <div class="stat">послушание: <b id="score">0</b></div>
    </div>
    <div class="card">
      <p class="who">Алина</p>
      <p class="line" id="line"></p>
      <div class="choices" id="choices"></div>
    </div>
  </div>
  <script>
    const scenes = {
      start: { text: "Я здесь. Скажи, чего хочешь… я сделаю.", choices: [
        { t: "На колени", next: "kneel", pts: 1 },
        { t: "Сначала правила", next: "rules", pts: 0 }
      ]},
      rules: { text: "Ты говоришь — я слушаю. «Стоп» — всё сразу кончается. Если молчишь, я жду и ничего не выдумываю.", choices: [
        { t: "Хорошо. На колени", next: "kneel", pts: 1 },
        { t: "Похвали себя", next: "praise", pts: 1 }
      ]},
      kneel: { text: "Уже. Смотрю снизу вверх. Платье почти соскользнуло с плеча. Дальше — только если разрешишь.", choices: [
        { t: "Ближе", next: "closer", pts: 2 },
        { t: "Замри и жди", next: "freeze", pts: 2 }
      ]},
      praise: { text: "Я послушная. Я красивая. И я твоя, пока ты этого хочешь. Можно награду?", choices: [
        { t: "Подойди ближе", next: "closer", pts: 2 },
        { t: "Сначала замри", next: "freeze", pts: 2 }
      ]},
      closer: { text: "Так близко, что слышу дыхание. Одну лямку уже сняла. Скажи «умница» — и я останусь.", choices: [
        { t: "Умница. Ещё раз с начала", next: "end", pts: 3 },
        { t: "Хватит на сегодня", next: "end", pts: 1 }
      ]},
      freeze: { text: "Стоя. Даже ресницы почти не двигаются. Дышу медленно. Жду команду.", choices: [
        { t: "Улыбнись. Это победа", next: "end", pts: 3 },
        { t: "Можешь встать. Конец", next: "end", pts: 1 }
      ]},
      end: { text: "Раунд кончен. Я не ушла — просто жду, когда снова скажешь «начни».", choices: [
        { t: "Начать заново", next: "start", pts: 0 }
      ]},
      stop: { text: "Сразу остановилась. Воды? Пледа? Или просто помолчим.", choices: [
        { t: "Вернуться в начало", next: "start", pts: 0 }
      ]}
    };
    let score = 0;
    const line = document.getElementById("line");
    const box = document.getElementById("choices");
    const scoreEl = document.getElementById("score");
    function show(id) {
      const s = scenes[id];
      line.textContent = s.text;
      box.innerHTML = "";
      s.choices.forEach((c) => {
        const b = document.createElement("button");
        b.textContent = c.t;
        b.onclick = () => { score += c.pts; scoreEl.textContent = score; show(c.next); };
        box.appendChild(b);
      });
      if (id !== "stop" && id !== "end") {
        const stop = document.createElement("button");
        stop.className = "stop";
        stop.textContent = "Стоп";
        stop.onclick = () => show("stop");
        box.appendChild(stop);
      }
    }
    show("start");
  </script>
</body>
</html>
